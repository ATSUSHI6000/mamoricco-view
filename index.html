<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まもりっこ - 受信モニター</title>
  <!-- SkyWay SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/token/dist/skyway_token-latest.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: #fce4ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      color: #e91e63;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .video-container {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
    }
    video {
      width: 100%;
      height: 540px;
      background-color: #000;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      background-color: #e91e63;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:active {
      opacity: 0.8;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #e91e63;
      padding: 8px 12px;
      background: #fff0f5;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>❤️ まもりっこ 画面モニター</h1>
    <div class="video-container" id="video-box">
      <video id="remote-video" autoplay playsinline></video>
    </div>
    
    <div class="controls">
      <button class="btn" id="fullscreen-btn">📺 全画面表示</button>
    </div>

    <div class="status" id="status-text">📡 接続準備中...</div>
  </div>

  <script>
    const APP_ID = "66b8e792-5087-4504-9d55-00cd6560ebb5";
    const SECRET_KEY = "BnCIV4hMkw0Nz9S6cIF8vfBPPZ+wz8I1mGcgy1rog94=";
    const ROOM_NAME = "mamorikko-room";

    let dataStream = null;

    async function startReceive() {
      const statusText = document.getElementById("status-text");
      const videoElement = document.getElementById("remote-video");
      const videoBox = document.getElementById("video-box");
      const fullscreenBtn = document.getElementById("fullscreen-btn");

      try {
        const { SkyWayAuthToken } = skyway_token;
        const { SkyWayContext, SkyWayRoom, LocalDataStream } = skyway_room;

        const now = Math.floor(Date.now() / 1000);
        const token = new SkyWayAuthToken({
          jti: crypto.randomUUID(),
          iat: now,
          exp: now + 3600 * 12,
          scope: {
            app: {
              id: APP_ID,
              turn: true,
              actions: ["read"],
              channels: [
                {
                  id: "*",
                  name: "*",
                  actions: ["write"],
                  members: [
                    {
                      id: "*",
                      name: "*",
                      actions: ["write"],
                      publication: { actions: ["write"] },
                      subscription: { actions: ["write"] }
                    }
                  ],
                  sfuBots: [
                    {
                      actions: ["write"],
                      forwardings: [{ actions: ["write"] }]
                    }
                  ]
                }
              ]
            }
          }
        }).encode(SECRET_KEY);

        statusText.innerText = "🔄 SkyWayサーバーに接続中...";

        const context = await SkyWayContext.Create(token);
        const room = await SkyWayRoom.FindOrCreate(context, {
          name: ROOM_NAME,
          type: "sfu"
        });

        const me = await room.join();

        // 遠隔操作データ送信用のデータストリームを作成して公開
        dataStream = new LocalDataStream();
        await me.publish(dataStream);

        statusText.innerText = "🟢 送信元（Android）の画面を探しています...";

        // 既存の配信がある場合
        room.publications.forEach(async (pub) => {
          if (pub.publisher.id !== me.id) {
            const { stream } = await me.subscribe(pub.id);
            if (stream.contentType === "video") {
              stream.attach(videoElement);
              statusText.innerText = "🎉 Android画面を受信中！（タップ操作可能）";
            }
          }
        });

        // 新しい配信が開始された場合
        room.onStreamPublished.add(async (e) => {
          if (e.publisher.id !== me.id) {
            const { stream } = await me.subscribe(e.publication.id);
            if (stream.contentType === "video") {
              stream.attach(videoElement);
              statusText.innerText = "🎉 Android画面を受信中！（タップ操作可能）";
            }
          }
        });

        // 画面タップイベントの処理（iPhone側からAndroidへ座標送信）
        const handleTap = (e) => {
          if (!dataStream) return;

          const rect = videoElement.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          // タップ位置を 0.0 ～ 1.0 の割合で計算
          const x = (clientX - rect.left) / rect.width;
          const y = (clientY - rect.top) / rect.height;

          if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
            const tapData = JSON.stringify({ type: "tap", x: x, y: y });
            dataStream.write(tapData);
            console.log("送信タップ座標:", x, y);
          }
        };

        videoElement.addEventListener("touchstart", handleTap, { passive: true });
        videoElement.addEventListener("click", handleTap);

        // 全画面表示ボタンの処理
        fullscreenBtn.addEventListener("click", () => {
          if (videoElement.requestFullscreen) {
            videoElement.requestFullscreen();
          } else if (videoElement.webkitRequestFullscreen) {
            videoElement.webkitRequestFullscreen(); // iOS Safari用
          }
        });

      } catch (e) {
        console.error(e);
        statusText.innerText = "❌ 接続エラー: " + e.message;
      }
    }

    window.addEventListener("load", startReceive);
  </script>
</body>
</html>
