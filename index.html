<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まもりっこ - 受信モニター</title>
  <!-- SkyWay SDK の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/token/dist/skyway_token-latest.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: #fce4ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      color: #e91e63;
      margin-top: 0;
      margin-bottom: 15px;
    }
    .video-container {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 📺 全画面時に画面いっぱいに収めるスタイル */
    .video-container.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      border-radius: 0;
      background-color: #000;
    }
    video {
      width: 100%;
      height: 540px;
      background-color: #000;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }
    .video-container.fullscreen video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
    .exit-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      background-color: #e91e63;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:active {
      opacity: 0.8;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #e91e63;
      padding: 8px 12px;
      background: #fff0f5;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>❤️ まもりっこ 画面モニター</h1>
    <div class="video-container" id="video-box">
      <video id="remote-video" autoplay playsinline muted></video>
      <button id="exit-fullscreen-btn" class="exit-btn" style="display: none;">✕ 全画面解除</button>
    </div>
    
    <div class="controls">
      <button class="btn" id="fullscreen-btn">📺 全画面表示</button>
    </div>

    <div class="status" id="status-text">📡 接続準備中...</div>
  </div>

  <script>
    const APP_ID = "66b8e792-5087-4504-9d55-00cd6560ebb5";
    const SECRET_KEY = "BnCIV4hMkw0Nz9S6cIF8vfBPPZ+wz8I1mGcgy1rog94=";
    const ROOM_NAME = "mamoricco-room-v2";

    let dataStream = null;
    let lastTapTime = 0; // ⚡ 連打・ツータップ防止用ガード

    async function startReceive() {
      const statusText = document.getElementById("status-text");
      const videoElement = document.getElementById("remote-video");
      const videoBox = document.getElementById("video-box");
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const exitFullscreenBtn = document.getElementById("exit-fullscreen-btn");

      try {
        const { SkyWayAuthToken } = skyway_token;
        const { SkyWayContext, SkyWayRoom, LocalDataStream } = skyway_room;

        const now = Math.floor(Date.now() / 1000);
        const token = new SkyWayAuthToken({
          jti: crypto.randomUUID(),
          iat: now,
          exp: now + 3600 * 12,
          scope: {
            app: {
              id: APP_ID,
              turn: true,
              actions: ["read"],
              channels: [
                {
                  id: "*",
                  name: "*",
                  actions: ["write"],
                  members: [
                    {
                      id: "*",
                      name: "*",
                      actions: ["write"],
                      publication: { actions: ["write"] },
                      subscription: { actions: ["write"] }
                    }
                  ],
                  sfuBots: [
                    {
                      actions: ["write"],
                      forwardings: [{ actions: ["write"] }]
                    }
                  ]
                }
              ]
            }
          }
        }).encode(SECRET_KEY);

        statusText.innerText = "🔄 SkyWayサーバーに接続中...";

        const context = await SkyWayContext.Create(token);
        
        const room = await SkyWayRoom.FindOrCreate(context, {
          name: ROOM_NAME,
          type: "p2p"
        });

        const me = await room.join();

        dataStream = new LocalDataStream();
        await me.publish(dataStream);

        statusText.innerText = "🟢 送信元（Android）の画面を探しています...";

        room.publications.forEach(async (pub) => {
          if (pub.publisher.id !== me.id) {
            const { stream } = await me.subscribe(pub.id);
            if (stream.contentType === "video") {
              stream.attach(videoElement);
              statusText.innerText = "🎉 Android画面を受信中！（タップ操作可能）";
            }
          }
        });

        room.onStreamPublished.add(async (e) => {
          if (e.publisher.id !== me.id) {
            const { stream } = await me.subscribe(e.publication.id);
            if (stream.contentType === "video") {
              stream.attach(videoElement);
              statusText.innerText = "🎉 Android画面を受信中！（タップ操作可能）";
            }
          }
        });

        // 🎯 ズレ防止＆ツータップ防止機能付きの精密タップ処理
        const handleTap = (e) => {
          if (!dataStream) return;

          // ⚡ ツータップ防止：300ミリ秒以内の連続イベント（touchstartとclickの重複）をカット！
          const nowTime = Date.now();
          if (nowTime - lastTapTime < 300) return;
          lastTapTime = nowTime;

          const rect = videoElement.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          const touchX = clientX - rect.left;
          const touchY = clientY - rect.top;

          // 📐 黒帯（余白）を自動補正する高精度座標計算
          const videoWidth = videoElement.videoWidth || 720;
          const videoHeight = videoElement.videoHeight || 1280;
          const videoAspect = videoWidth / videoHeight;
          const rectAspect = rect.width / rect.height;

          let renderWidth, renderHeight, offsetX, offsetY;

          if (rectAspect > videoAspect) {
            // 左右に黒帯がある場合
            renderHeight = rect.height;
            renderWidth = rect.height * videoAspect;
            offsetX = (rect.width - renderWidth) / 2;
            offsetY = 0;
          } else {
            // 上下に黒帯がある場合
            renderWidth = rect.width;
            renderHeight = rect.width / videoAspect;
            offsetX = 0;
            offsetY = (rect.height - renderHeight) / 2;
          }

          // 黒帯を除いた「純粋な画面」上の位置(0.0 ～ 1.0)
          const x = (touchX - offsetX) / renderWidth;
          const y = (touchY - offsetY) / renderHeight;

          if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
            const tapData = JSON.stringify({ type: "tap", x: x, y: y });
            dataStream.write(tapData);
            console.log("送信タップ座標（補正済）:", x, y);
          }
        };

        // イベント二重発火を防ぐため touchstart メインに設定
        videoElement.addEventListener("touchstart", handleTap, { passive: true });
        videoElement.addEventListener("click", handleTap);

        fullscreenBtn.addEventListener("click", () => {
          videoBox.classList.add("fullscreen");
          exitFullscreenBtn.style.display = "block";
        });

        exitFullscreenBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          videoBox.classList.remove("fullscreen");
          exitFullscreenBtn.style.display = "none";
        });

      } catch (e) {
        console.error(e);
        statusText.innerText = "❌ 接続エラー: " + e.message;
      }
    }

    window.addEventListener("load", startReceive);
  </script>
</body>
</html>
