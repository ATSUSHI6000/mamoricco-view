<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>まもりっこ - 受信・遠隔操作モニター</title>
  
  <!-- 🌟 Safariのブロックを回避するため、ページの先頭で確実にライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room@latest/dist/skyway-room.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #fce4ec;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #e91e63;
      font-size: 20px;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none !important;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none !important;
    }
    .touch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }
    .status-badge {
      margin-top: 15px;
      padding: 8px 15px;
      background: #fff0f5;
      color: #d81b60;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>❤️ まもりっこ 遠隔操作モニター</h2>
    
    <div class="video-container">
      <video id="remote-video" autoplay playsinline muted webkit-playsinline disablepictureinpicture></video>
      <div class="touch-overlay" id="touch-area"></div>
    </div>

    <div class="status-badge" id="status-text">📡 接続処理を開始します...</div>
  </div>

  <script>
    // 画面の読み込みが完全に完了したら実行
    window.addEventListener('load', async () => {
      const statusText = document.getElementById('status-text');
      const videoElement = document.getElementById('remote-video');
      const touchArea = document.getElementById('touch-area');

      // 1. SkyWayライブラリの読み込み確認
      if (typeof skywayRoom === 'undefined') {
        statusText.innerText = "❌ ライブラリ読み込み不可（コンテンツブロッカー等の影響の可能性があります）";
        return;
      }

      const { SkyWayContext, SFURoom } = skywayRoom;

      try {
        // 2. GETリクエストでトークンを取得
        statusText.innerText = "🔑 1/4 トークン取得中...";
        const response = await fetch('https://script.google.com/macros/s/AKfycbwk4miPAQ26KXHmcSym-qxWQELIuyaD33KeQhrNqoZb6ttc3pbdRtniEdE7u48sghFV/exec?contentType=get_skyway_token');
        const data = await response.json();
        
        if (!data || !data.authToken) {
          statusText.innerText = "❌ トークン取得失敗";
          return;
        }

        // 3. SkyWayルーム接続
        statusText.innerText = "🌐 2/4 ルームに入室中...";
        const context = await SkyWayContext.Create(data.authToken);
        const room = await SFURoom.FindOrCreate(context, { name: 'mamorikko-room' });
        const member = await room.join({ name: 'iPhoneReceiver' });

        // 4. 遠隔操作用データストリームの準備
        statusText.innerText = "⚙️ 3/4 遠隔操作ストリーム設定中...";
        let dataStream = null;
        try {
          dataStream = await SkyWayContext.CreateDataStream();
          await member.publish(dataStream);
        } catch (dsErr) {
          console.log("DataStream Notice:", dsErr);
        }

        statusText.innerText = "🔍 4/4 Android（送信元）の映像を待っています...";

        // 映像受信＆再生処理
        const subscribeAndPlay = async (publication) => {
          if (publication.contentType === 'video') {
            statusText.innerText = "📥 映像受信中... 再生開始します";
            try {
              const { stream } = await member.subscribe(publication.id);
              stream.attach(videoElement);
              await videoElement.play();
              statusText.innerText = "🎉 遠隔操作が可能です！";
            } catch (playErr) {
              statusText.innerText = "🎉 画面を一度タップしてください！";
            }
          }
        };

        room.publications.forEach(pub => subscribeAndPlay(pub));
        room.onStreamPublished.add(e => subscribeAndPlay(e.publication));

        // 👆 タップ・スワイプ操作送信用
        let startX = 0, startY = 0;

        touchArea.addEventListener('pointerdown', (e) => {
          const rect = touchArea.getBoundingClientRect();
          startX = (e.clientX - rect.left) / rect.width;
          startY = (e.clientY - rect.top) / rect.height;
        });

        touchArea.addEventListener('pointerup', (e) => {
          if (!dataStream) return;
          const rect = touchArea.getBoundingClientRect();
          const endX = (e.clientX - rect.left) / rect.width;
          const endY = (e.clientY - rect.top) / rect.height;

          const dist = Math.hypot(endX - startX, endY - startY);
          if (dist < 0.03) {
            dataStream.write(JSON.stringify({ type: 'tap', x: endX, y: endY }));
          } else {
            dataStream.write(JSON.stringify({ type: 'swipe', sx: startX, sy: startY, ex: endX, ey: endY }));
          }
        });

      } catch (err) {
        console.error(err);
        statusText.innerText = "❌ エラー: " + (err.message || err);
      }
    });
  </script>
</body>
</html>
