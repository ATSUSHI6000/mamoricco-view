<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>まもりっこ - 受信・遠隔操作モニター</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fce4ec; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #e91e63; font-size: 18px; margin: 5px 0 10px 0; }
    .video-container { position: relative; width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; touch-action: none; }
    video { width: 100%; height: 100%; object-fit: contain; pointer-events: none !important; }
    .touch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
    #log-box { text-align: left; background: #1e1e1e; color: #00ff66; padding: 10px; border-radius: 10px; font-family: monospace; font-size: 11px; max-height: 180px; overflow-y: auto; margin-top: 10px; word-break: break-all; line-height: 1.4; }
    .error-log { color: #ff5555 !important; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>❤️ まもりっこ 遠隔操作</h2>
    
    <div class="video-container">
      <video id="remote-video" autoplay playsinline muted webkit-playsinline disablepictureinpicture></video>
      <div class="touch-overlay" id="touch-area"></div>
    </div>

    <!-- 📟 iPhone画面デバッグログ枠 -->
    <div id="log-box">🚀 診断システム起動中...<br></div>
  </div>

  <script>
    function log(msg, isError = false) {
      const box = document.getElementById('log-box');
      if (box) {
        const time = new Date().toLocaleTimeString();
        const colorStyle = isError ? 'class="error-log"' : '';
        box.innerHTML += `<div ${colorStyle}>[${time}] ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
      }
    }

    window.onerror = function(msg, url, line) {
      log(`❌ 構文/実行エラー: ${msg} (L${line})`, true);
      return false;
    };
    window.onunhandledrejection = function(e) {
      log(`❌ 通信エラー: ${e.reason}`, true);
    };
  </script>

  <script type="module">
    log('📱 ページ読込完了。通信ライブラリの自動切替ロードを開始...');

    const videoElement = document.getElementById('remote-video');
    const touchArea = document.getElementById('touch-area');

    async function startApp() {
      let SkyWayContext, SFURoom, LocalDataStream;

      // 🌐 予備含む高速CDNリスト
      const cdnList = [
        'https://cdn.jsdelivr.net/npm/@skyway-sdk/room/+esm',
        'https://esm.sh/@skyway-sdk/room',
        'https://cdn.skypack.dev/@skyway-sdk/room'
      ];

      for (const url of cdnList) {
        const domain = url.split('/')[2];
        try {
          log(`📦 ${domain} からSDK読み込み試行中...`);
          const mod = await import(url);
          if (mod && mod.SkyWayContext && mod.SFURoom) {
            SkyWayContext = mod.SkyWayContext;
            SFURoom = mod.SFURoom;
            LocalDataStream = mod.LocalDataStream;
            log(`✅ ${domain} からSDK読み込み成功！`);
            break;
          }
        } catch (e) {
          log(`⚠️ ${domain} 接続失敗。次のサーバーへ切り替えます...`);
        }
      }

      if (!SkyWayContext || !SFURoom) {
        log('❌ すべての通信サーバーでライブラリ読み込みに失敗しました', true);
        return;
      }

      try {
        log('🔑 1/4 GASへトークン要求中...');
        const res = await fetch('https://script.google.com/macros/s/AKfycbwk4miPAQ26KXHmcSym-qxWQELIuyaD33KeQhrNqoZb6ttc3pbdRtniEdE7u48sghFV/exec?contentType=get_skyway_token');
        const data = await res.json();

        if (!data || !data.authToken) {
          log('❌ 1/4 トークン取得失敗（GASからの返事なし）', true);
          return;
        }
        log('✅ 1/4 トークン取得成功！');

        log('🌐 2/4 SkyWayルーム入室中...');
        const context = await SkyWayContext.Create(data.authToken);
        const room = await SFURoom.FindOrCreate(context, { name: 'mamorikko-room' });
        const member = await room.join({ name: 'iPhoneReceiver' });
        log('✅ 2/4 ルーム入室成功！');

        log('⚙️ 3/4 データストリーム準備中...');
        let dataStream = null;
        try {
          if (LocalDataStream) {
            dataStream = new LocalDataStream();
            await member.publish(dataStream);
          } else {
            dataStream = await SkyWayContext.CreateDataStream();
            await member.publish(dataStream);
          }
          log('✅ 3/4 遠隔操作ストリーム設定完了！');
        } catch(dsErr) {
          log('⚠️ 3/4 データストリーム警告: ' + dsErr.message);
        }

        log('🔍 4/4 Android（送信元）の映像待機中...');

        const subscribeAndPlay = async (pub) => {
          if (pub.contentType === 'video') {
            log('📥 映像検出！受信を開始します...');
            try {
              const { stream } = await member.subscribe(pub.id);
              stream.attach(videoElement);
              await videoElement.play();
              log('🎉 映像受信成功！遠隔操作可能です！');
            } catch (pErr) {
              log('⚠️ 再生待機中（画面を一度タップしてください）');
            }
          }
        };

        room.publications.forEach(pub => subscribeAndPlay(pub));
        room.onStreamPublished.add(e => subscribeAndPlay(e.publication));

        // タップ・スワイプイベント
        let startX = 0, startY = 0;
        touchArea.addEventListener('pointerdown', (e) => {
          const rect = touchArea.getBoundingClientRect();
          startX = (e.clientX - rect.left) / rect.width;
          startY = (e.clientY - rect.top) / rect.height;
        });

        touchArea.addEventListener('pointerup', (e) => {
          if (!dataStream) return;
          const rect = touchArea.getBoundingClientRect();
          const endX = (e.clientX - rect.left) / rect.width;
          const endY = (e.clientY - rect.top) / rect.height;
          const dist = Math.hypot(endX - startX, endY - startY);
          if (dist < 0.03) {
            dataStream.write(JSON.stringify({ type: 'tap', x: endX, y: endY }));
          } else {
            dataStream.write(JSON.stringify({ type: 'swipe', sx: startX, sy: startY, ex: endX, ey: endY }));
          }
        });

      } catch (err) {
        log('❌ 全体例外エラー: ' + (err.message || err), true);
      }
    }

    startApp();
  </script>
</body>
</html>
